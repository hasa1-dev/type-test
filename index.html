<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasanboy & Sanjarbek - Typing System v2.0</title>
    <!-- Firebase SDK (Dasturni ishlashi uchun zarur) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        :root { 
            --neon: #00ff41; 
            --bg: #0a0a0f; 
            --glass: rgba(0, 20, 0, 0.9);
            --bg-img: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070&auto=format&fit=crop'); 
        }
        
        * { box-sizing: border-box; outline: none; }
        
        body { 
            margin: 0; 
            background: var(--bg-img) no-repeat center center fixed;
            background-size: cover;
            color: var(--neon); 
            font-family: 'Courier New', monospace; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: -1;
        }
        
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .container { 
            width: 100%; 
            max-width: 900px; 
            padding: 25px; 
            background: var(--glass); 
            border: 1px solid var(--neon); 
            border-radius: 15px; 
            text-align: center; 
            backdrop-filter: blur(15px);
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.2);
        }

        /* LOGIN MODAL - Haqiqiy Email/Parol bilan */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; align-items: center; justify-content: center;
            z-index: 2000;
        }
        .login-card {
            background: rgba(0, 40, 0, 0.3);
            border: 2px solid var(--neon);
            padding: 35px;
            border-radius: 15px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 0 30px var(--neon);
        }
        .login-card input {
            width: 100%;
            background: #000;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 12px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: inherit;
        }
        
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn { 
            background: transparent; 
            border: 1px solid var(--neon); 
            color: var(--neon); 
            padding: 8px 18px; 
            cursor: pointer; 
            transition: 0.2s; 
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        .btn.active { background: var(--neon); color: #000; font-weight: bold; box-shadow: 0 0 15px var(--neon); }
        .btn:hover:not(.active) { background: rgba(0, 255, 65, 0.2); }
        
        .stats-bar { 
            display: flex; 
            justify-content: space-around; 
            padding: 15px; 
            border: 1px solid rgba(0, 255, 65, 0.3);
            margin-bottom: 20px; 
            background: rgba(0,0,0,0.5);
        }

        #text-display { 
            font-size: 1.5rem; 
            line-height: 1.6; 
            text-align: left; 
            min-height: 150px;
            margin: 20px 0; 
            color: rgba(0, 255, 65, 0.25); 
            padding: 15px; 
            word-wrap: break-word;
        }
        
        .char { transition: 0.05s; border-left: 1px solid transparent; }
        .correct { color: var(--neon); text-shadow: 0 0 5px var(--neon); }
        .incorrect { color: #ff0000; background: rgba(255, 0, 0, 0.3); }
        .current { background: rgba(0, 255, 65, 0.3); border-left: 2px solid var(--neon); animation: pulse 0.8s infinite; }
        
        @keyframes pulse { 50% { background: transparent; } }

        #hidden-input { position: fixed; top: -100px; }

        .about-section { 
            margin-top: 30px; 
            padding: 15px;
            border-top: 1px solid rgba(0,255,65,0.2); 
            font-size: 0.85rem; 
            line-height: 1.5;
        }

        footer { padding: 20px; text-align: center; font-size: 0.9rem; background: rgba(0,0,0,0.9); }
        footer a { color: var(--neon); text-decoration: none; border-bottom: 1px solid var(--neon); }
        
        /* Mobile adjustment */
        @media (max-width: 600px) {
            #text-display { font-size: 1.2rem; }
            .container { padding: 15px; }
        }
    </style>
</head>
<body onclick="document.getElementById('hidden-input').focus()">

    <!-- HACKER LOGIN WINDOW -->
    <div id="login-overlay">
        <div class="login-card">
            <h2 style="margin-bottom: 20px;">ACCESS GRANTED</h2>
            <input type="email" id="email" placeholder="EMAIL ADDRESS...">
            <input type="password" id="password" placeholder="PASSWORD...">
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn active" style="flex: 1;" onclick="handleAuth('login')">LOGIN</button>
                <button class="btn" style="flex: 1;" onclick="handleAuth('signup')">SIGN UP</button>
            </div>
            <p id="auth-error" style="color: #ff0000; font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </div>

    <main>
        <div class="container">
            <div class="controls">
                <button class="btn active lang-btn" onclick="changeLang('uz', this)">O'ZBEK</button>
                <button class="btn lang-btn" onclick="changeLang('en', this)">ENGLISH</button>
                <button class="btn time-btn" onclick="setTime(15, this)">15s</button>
                <button class="btn time-btn active" onclick="setTime(30, this)">30s</button>
                <button class="btn time-btn" onclick="setTime(60, this)">60s</button>
            </div>

            <div class="stats-bar">
                <span>SYSTEM_ID: <b id="user-display">UNIDENTIFIED</b></span>
                <span>TIMER: <b id="timer">30</b>s</span>
                <span>WPM: <b id="wpm">0</b></span>
            </div>

            <div id="text-display"></div>
            <input type="text" id="hidden-input" autocomplete="off">

            <div class="about-section">
                <p>Architects: <b>Hasanboy</b> & <b>Sanjarbek</b>. <br> 
                Authorized usage only. System version 2.0.0_matrix.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 | <a href="https://t.me/xsT00my" target="_blank">@Hasanboy</a> | <a href="https://t.me/saSOObr" target="_blank">@Sanjarbek</a></p>
    </footer>

    <script>
        // Firebase Config (O'zingiznikini bu yerga qo'ying)
        const firebaseConfig = { apiKey: "YOUR_API_KEY", authDomain: "YOUR_PROJECT.firebaseapp.com", projectId: "YOUR_PROJECT_ID" };
        firebase.initializeApp(firebaseConfig);

        const wordBank = {
            uz: ["tizim", "xavfsizlik", "algoritm", "klaviatura", "bajarish", "mantiq", "server", "ma'lumot", "dastur"],
            en: ["system", "security", "algorithm", "keyboard", "execute", "logic", "server", "database", "program"]
        };

        let currentLang = 'uz', maxTime = 30, timeLeft = 30, isPlaying = false, timer = null;
        const display = document.getElementById('text-display');
        const input = document.getElementById('hidden-input');

        // Auth Mantiqi
        function handleAuth(type) {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const errorElement = document.getElementById('auth-error');

            if(type === 'login') {
                firebase.auth().signInWithEmailAndPassword(email, pass)
                    .then(res => { 
                        document.getElementById('user-display').innerText = res.user.email.split('@')[0];
                        document.getElementById('login-overlay').style.display = 'none';
                        init();
                    })
                    .catch(err => errorElement.innerText = "Xatolik: " + err.message);
            } else {
                firebase.auth().createUserWithEmailAndPassword(email, pass)
                    .then(() => alert("Ro'yxatdan o'tdingiz! Endi Login qiling."))
                    .catch(err => errorElement.innerText = "Xatolik: " + err.message);
            }
        }

        function init() {
            if (timer) clearInterval(timer);
            isPlaying = false; timeLeft = maxTime;
            input.value = "";
            document.getElementById('timer').innerText = timeLeft;
            
            const words = wordBank[currentLang];
            let text = Array.from({length: 40}, () => words[Math.floor(Math.random() * words.length)]).join(' ');
            display.innerHTML = text.split('').map((c, i) => `<span class="char ${i===0?'current':''}">${c}</span>`).join('');
            input.focus();
        }

        input.addEventListener('input', () => {
            if (!isPlaying && input.value.length > 0) {
                isPlaying = true;
                timer = setInterval(() => {
                    if (timeLeft > 0) { timeLeft--; document.getElementById('timer').innerText = timeLeft; }
                    else { clearInterval(timer); isPlaying = false; alert("Vaqt tugadi! WPM: " + document.getElementById('wpm').innerText); init(); }
                }, 1000);
            }

            const spans = display.querySelectorAll('.char');
            const typed = input.value.split('');
            let correctCount = 0;

            spans.forEach((s, i) => {
                s.classList.remove('correct', 'incorrect', 'current');
                if (typed[i] == null) {
                    if (i === typed.length) s.classList.add('current');
                } else {
                    if (typed[i] === s.innerText) { s.classList.add('correct'); correctCount++; }
                    else s.classList.add('incorrect');
                }
            });

            let timeUsed = (maxTime - timeLeft) || 1;
            let wpm = Math.round((correctCount / 5) / (timeUsed / 60));
            document.getElementById('wpm').innerText = wpm;
        });

        function setTime(s, btn) { maxTime = s; document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); init(); }
        function changeLang(l, btn) { currentLang = l; document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); init(); }
    </script>
</body>
</html>
