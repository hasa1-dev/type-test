<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasanboy - Multi-Lang Typing System</title>
    <style>
        :root {
            --neon: #00ff41;
            --bg: #0a0a0f;
            --glass: rgba(0, 20, 0, 0.85);
        }

        * { box-sizing: border-box; outline: none; }

        body, html {
            margin: 0; padding: 0; min-height: 100vh;
            background: radial-gradient(circle at center, #001a00 0%, var(--bg) 100%);
            color: var(--neon);
            font-family: 'Consolas', monospace;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 95%; max-width: 1000px;
            margin: 20px auto; padding: 20px;
            background: var(--glass);
            border: 3px solid var(--neon);
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }

        .controls {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 10px; margin-bottom: 20px;
        }

        .btn {
            background: transparent; border: 1px solid var(--neon);
            color: var(--neon); padding: 8px 15px; cursor: pointer;
            font-family: inherit; border-radius: 5px; transition: 0.3s;
        }

        .btn.active { background: var(--neon); color: #000; font-weight: bold; }

        .stats-bar {
            display: flex; justify-content: space-around;
            padding: 15px; background: rgba(0, 0, 0, 0.5);
            margin-bottom: 20px; border-radius: 5px; font-size: 1.2rem;
        }

        #text-display {
            font-size: 1.8rem; line-height: 1.6;
            height: 200px; overflow-y: hidden;
            text-align: left; margin: 20px 0;
            color: #004d1a; padding: 10px;
            border: 1px solid rgba(0, 255, 65, 0.1);
            word-break: break-word;
        }

        @media (max-width: 600px) {
            #text-display { font-size: 1.4rem; height: 150px; }
            .stats-bar { font-size: 1rem; }
        }

        .char { transition: all 0.1s; border-bottom: 2px solid transparent; }
        .correct { color: var(--neon); text-shadow: 0 0 8px var(--neon); }
        .incorrect { color: #ff3e3e; background: rgba(255, 62, 62, 0.2); border-radius: 2px; }
        .current { border-bottom: 4px solid var(--neon); background: rgba(0, 255, 65, 0.1); }

        #hidden-input { position: fixed; top: -100px; left: 0; opacity: 0; }

        .author-card {
            width: 95%; max-width: 1000px; margin: 10px; padding: 15px;
            background: rgba(0, 0, 0, 0.8); border: 1px solid var(--neon);
            text-align: center; border-radius: 10px;
        }

        .author-card p { margin: 5px 0; }

        .result-screen {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #000; border: 4px solid var(--neon); padding: 30px;
            z-index: 100; text-align: center; display: none; width: 90%; max-width: 500px;
            box-shadow: 0 0 50px #000;
        }

        #motivation-text { color: #fff; font-style: italic; margin: 15px 0; display: block; }
    </style>
</head>
<body onclick="document.getElementById('hidden-input').focus()">

    <div class="container" id="main-ui">
        <div class="controls">
            <button class="btn active" onclick="changeLang('uz', this)">O'ZBEK</button>
            <button class="btn" onclick="changeLang('en', this)">ENGLISH</button>
            <button class="btn" onclick="changeLang('ru', this)">РУССКИЙ</button>
        </div>

        <div class="stats-bar">
            <span>TIME: <b id="timer">30</b>s</span>
            <span>WPM: <b id="wpm">0</b></span>
            <span>ERRORS: <b id="errors">0</b></span>
        </div>

        <div id="text-display"></div>
        <input type="text" id="hidden-input" autocomplete="off" autofocus>
    </div>

    <!-- Avtorlik va Sana qismi -->
    <div class="author-card">
        <p>Architect: <a href="https://t.me/xsT00my" target="_blank" style="color:var(--neon); text-decoration: none; border-bottom: 1px dashed var(--neon);">Hasanboy</a></p>
        <p style="font-size: 0.8rem; opacity: 0.7;">Dev: <b>hasan_dev</b> | Released: August 2025</p>
    </div>

    <div id="result-screen" class="result-screen">
        <h1 style="color: var(--neon); margin-top:0;">MISSION ENDED</h1>
        <p id="final-stats" style="color: #fff; font-size: 1.4rem; margin: 10px 0;"></p>
        <b id="motivation-text"></b>
        <button onclick="location.reload()" style="padding: 12px 25px; cursor:pointer; background:var(--neon); border:none; font-weight:bold; margin-top:10px; border-radius:5px;">QAYTADAN URINISH</button>
    </div>

    <script>
        const wordBank = {
            uz: ["texnologiya", "dasturlash", "internet", "tarmoq", "xavfsizlik", "tizim", "mantiq", "funksiya", "loyiha", "natija", "aloqa", "tezlik", "bilim", "tajriba", "terminal", "algoritm", "server", "shifr", "parol", "kirish", "yuklash", "zamonaviy", "protsessor", "klaviatura", "bajarish", "tahlil", "ishonch", "kelajak", "amaliyot", "ma'lumot", "obyekt", "klas", "kod", "blok", "sayt", "ilova"],
            en: ["technology", "programming", "internet", "network", "security", "system", "logic", "function", "project", "result", "connection", "speed", "knowledge", "experience", "terminal", "algorithm", "server", "cipher", "password", "login", "upload", "modern", "processor", "keyboard", "execute", "analysis", "trust", "future", "practice", "information", "object", "class", "code", "block", "site", "application"],
            ru: ["технология", "программирование", "интернет", "сеть", "безопасность", "система", "логика", "функция", "проект", "результат", "связь", "скорость", "знание", "опыт", "терминал", "алгоритм", "сервер", "шифр", "пароль", "вход", "загрузка", "современный", "процессор", "клавиатура", "выполнить", "анализ", "доверие", "будущее", "практика", "информация", "объект", "класс", "код", "блок", "сайт", "приложение"]
        };

        const motivBank = {
            uz: { high: "Siz haqiqiy professional ekansiz! 🚀", med: "Yaxshi natija! Harakatdan to'xtamang. 🔥", low: "Hali hammasi oldinda, ko'proq mashq qiling! 💪" },
            en: { high: "You are a true professional! 🚀", med: "Great result! Keep pushing. 🔥", low: "Don't give up, more practice is needed! 💪" },
            ru: { high: "Вы настоящий профессионал! 🚀", med: "Хороший результат! Не останавливайтесь. 🔥", low: "Все еще впереди, больше тренируйтесь! 💪" }
        };

        const display = document.getElementById('text-display');
        const input = document.getElementById('hidden-input');
        
        let currentLang = 'uz';
        let timeLeft = 30;
        let isPlaying = false;
        let timer = null;

        function init() {
            const words = wordBank[currentLang];
            let text = Array.from({length: 60}, () => words[Math.floor(Math.random() * words.length)]).join(' ');
            display.innerHTML = text.split('').map((char, i) => `<span class="char ${i===0?'current':''}">${char}</span>`).join('');
            input.value = "";
            timeLeft = 30;
            document.getElementById('timer').innerText = timeLeft;
        }

        function changeLang(lang, btn) {
            if (isPlaying) return;
            currentLang = lang;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            init();
        }

        input.addEventListener('input', () => {
            if(!isPlaying && input.value.length > 0) {
                isPlaying = true;
                timer = setInterval(() => {
                    if(timeLeft > 0) { 
                        timeLeft--; 
                        document.getElementById('timer').innerText = timeLeft; 
                    } else { 
                        endGame();
                    }
                }, 1000);
            }

            const spans = display.querySelectorAll('.char');
            const typedChars = input.value.split('');
            let errors = 0;

            spans.forEach((span, index) => {
                const char = typedChars[index];
                span.classList.remove('correct', 'incorrect', 'current');
                
                if (char == null) {
                    if (index === typedChars.length) {
                        span.classList.add('current');
                        span.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else if (char === span.innerText) {
                    span.classList.add('correct');
                } else {
                    span.classList.add('incorrect');
                    errors++;
                }
            });

            document.getElementById('errors').innerText = errors;
            let wpm = Math.round(((typedChars.length - errors) / 5) / ((30 - timeLeft) / 60));
            document.getElementById('wpm').innerText = wpm > 0 ? wpm : 0;

            if (typedChars.length >= spans.length) endGame();
        });

        function endGame() {
            clearInterval(timer);
            const wpm = parseInt(document.getElementById('wpm').innerText);
            const errors = document.getElementById('errors').innerText;
            
            document.getElementById('main-ui').style.opacity = '0.1';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-stats').innerText = `${wpm} WPM | ${errors} Xatolar`;
            
            const motivText = document.getElementById('motivation-text');
            const m = motivBank[currentLang];
            
            if (wpm >= 50) motivText.innerText = m.high;
            else if (wpm >= 25) motivText.innerText = m.med;
            else motivText.innerText = m.low;
        }

        init();
    </script>
</body>
</html>
