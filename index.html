<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasanboy - Typing System v4.1</title>
    <style>
        :root { --neon: #00ff41; --bg: #0a0a0f; --glass: rgba(0, 25, 0, 0.95); }
        * { box-sizing: border-box; outline: none; }
        body { 
            margin: 0; background: #000; color: var(--neon); 
            font-family: 'Courier New', monospace; min-height: 100vh; overflow-x: hidden;
        }

        /* Auth Overlay - Xato tuzatildi (justify-content) */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; align-items: center; justify-content: center; z-index: 3000;
        }
        .auth-card {
            background: var(--glass); border: 2px solid var(--neon);
            padding: 30px; border-radius: 15px; width: 400px; text-align: center;
            box-shadow: 0 0 30px var(--neon);
        }
        .auth-card input, .auth-card select {
            width: 100%; background: #000; border: 1px solid var(--neon);
            color: var(--neon); padding: 12px; margin: 8px 0; font-size: 1rem; border-radius: 5px;
        }

        .navbar {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 30px;
            border-bottom: 1px solid var(--neon); background: rgba(0,0,0,0.8);
        }
        .btn { 
            background: transparent; border: 1px solid var(--neon); 
            color: var(--neon); padding: 8px 15px; cursor: pointer; text-transform: uppercase;
            font-family: inherit; font-size: 0.8rem; margin: 2px;
        }
        .btn:hover, .btn.active { background: var(--neon); color: #000; box-shadow: 0 0 10px var(--neon); }

        .container { max-width: 1000px; margin: 20px auto; padding: 20px; text-align: center; }
        #text-display { 
            font-size: 1.6rem; text-align: left; min-height: 100px; margin: 20px 0; 
            color: rgba(0, 255, 65, 0.2); padding: 20px; line-height: 1.6; border: 1px solid rgba(0,255,65,0.1);
            word-break: break-all;
        }
        .char.correct { color: var(--neon); text-shadow: 0 0 8px var(--neon); }
        .char.incorrect { color: #ff0000; background: rgba(255, 0, 0, 0.2); }
        .char.current { border-bottom: 3px solid var(--neon); animation: blink 0.8s infinite; }
        @keyframes blink { 50% { border-color: transparent; } }

        #keyboard-container {
            margin-top: 30px; display: flex; flex-direction: column; align-items: center;
        }
        .keyboard-row { display: flex; gap: 5px; margin-bottom: 5px; }
        .key {
            width: 50px; height: 50px; border: 1px solid var(--neon);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1rem; border-radius: 5px;
            background: rgba(0, 255, 65, 0.05); transition: 0.1s;
        }
        .key.active { background: var(--neon); color: #000; transform: scale(0.9); box-shadow: 0 0 15px var(--neon); }
        .key.space { width: 300px; }

        .stats { display: flex; justify-content: center; gap: 40px; font-size: 1.3rem; margin-top: 10px; }
        #hidden-input { position: fixed; top: -100px; opacity: 0; }
        .hidden { display: none !important; }

        @media (max-width: 800px) {
            #keyboard-container, #toggle-kb-btn { display: none !important; }
        }
    </style>
</head>
<body onclick="focusGame()">

    <div id="auth-overlay">
        <div class="auth-card">
            <h2 id="auth-title">KIRISH</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button class="btn active" id="btn-login-tab" onclick="toggleMode('login')">KIRISH</button>
                <button class="btn" id="btn-signup-tab" onclick="toggleMode('signup')">RO'YXATDAN O'TISH</button>
            </div>
            <input type="text" id="auth-name" placeholder="ISMINGIZ...">
            <div id="signup-extras" class="hidden">
                <input type="number" id="auth-age" placeholder="YOSHINGIZ...">
                <select id="auth-gender">
                    <option value="" disabled selected>JINSINGIZ</option>
                    <option value="erkak">ERKAK</option>
                    <option value="ayol">AYOL</option>
                </select>
            </div>
            <input type="password" id="auth-pass" placeholder="PAROL...">
            <button class="btn active" style="width: 100%; font-size: 1rem; padding: 12px; margin-top: 10px;" onclick="processAuth()" id="auth-main-btn">TIZIMGA KIRISH</button>
            <p id="auth-msg" style="color: #ff3333; font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </div>

    <nav class="navbar">
        <div style="font-weight: bold; letter-spacing: 2px;">HASANBOY_DEV</div>
        <div>FOYDALANUVCHI: <span id="current-user">GUEST</span></div>
        <div>
            <button class="btn" onclick="toggleKB()" id="toggle-kb-btn">⌨️ KLAVIATURA</button>
            <button class="btn" onclick="toggleMusic()" id="music-btn">🎵 CHALISH</button>
            <button class="btn" onclick="nextTrack()">⏭️ KEYINGISI</button>
        </div>
    </nav>

    <main class="container">
        <div class="controls">
            <button class="btn active lang-btn" onclick="changeLang('uz', this)">O'ZBEK</button>
            <button class="btn lang-btn" onclick="changeLang('ru', this)">RUSCHA</button>
            <button class="btn lang-btn" onclick="changeLang('en', this)">ENG</button>
            |
            <button class="btn time-btn active" onclick="setTime(30, this)">30 SEK</button>
            <button class="btn time-btn" onclick="setTime(60, this)">60 SEK</button>
        </div>

        <div id="text-display"></div>
        <input type="text" id="hidden-input" autocomplete="off" spellcheck="false">

        <div class="stats">
            <span>WPM: <b id="wpm">0</b></span>
            <span>ANIQLIK: <b id="accuracy">100</b>%</span>
            <span>VAQT: <b id="timer">30</b>s</span>
        </div>

        <div id="keyboard-container">
            <!-- Klaviatura qatorlari -->
            <div class="keyboard-row">
                <div class="key" id="key-q">Q</div><div class="key" id="key-w">W</div><div class="key" id="key-e">E</div><div class="key" id="key-r">R</div><div class="key" id="key-t">T</div><div class="key" id="key-y">Y</div><div class="key" id="key-u">U</div><div class="key" id="key-i">I</div><div class="key" id="key-o">O</div><div class="key" id="key-p">P</div>
            </div>
            <div class="keyboard-row">
                <div class="key" id="key-a">A</div><div class="key" id="key-s">S</div><div class="key" id="key-d">D</div><div class="key" id="key-f">F</div><div class="key" id="key-g">G</div><div class="key" id="key-h">H</div><div class="key" id="key-j">J</div><div class="key" id="key-k">K</div><div class="key" id="key-l">L</div>
            </div>
            <div class="keyboard-row">
                <div class="key" id="key-z">Z</div><div class="key" id="key-x">X</div><div class="key" id="key-c">C</div><div class="key" id="key-v">V</div><div class="key" id="key-b">B</div><div class="key" id="key-n">N</div><div class="key" id="key-m">M</div>
            </div>
            <div class="keyboard-row">
                <div class="key space" id="key-space">SPACE</div>
            </div>
        </div>
    </main>

    <audio id="bg-audio" onended="nextTrack()"></audio>

    <script>
        const wordBank = {
            uz: ["tizim", "mantiq", "dastur", "kodlash", "tarmoq", "xaker", "kripto", "algoritm", "klaviatura", "bajarish"],
            ru: ["система", "логика", "программа", "код", "сеть", "хакер", "крипто", "алгоритм", "клавиатура", "выполнить"],
            en: ["system", "logic", "program", "coding", "network", "hacker", "crypto", "algorithm", "keyboard", "execute"]
        };

        const playlist = [
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"
        ];

        let mode = 'login', currentTrackIndex = 0, currentLang = 'uz', maxTime = 30, timeLeft = 30, isPlaying = false, timerInterval = null;
        const audio = document.getElementById('bg-audio');
        audio.src = playlist[currentTrackIndex];

        function toggleMode(m) {
            mode = m;
            document.getElementById('auth-title').innerText = mode === 'login' ? 'KIRISH' : "RO'YXATDAN O'TISH";
            document.getElementById('auth-main-btn').innerText = mode === 'login' ? 'TIZIMGA KIRISH' : "RO'YXATDAN O'TISH";
            document.getElementById('signup-extras').classList.toggle('hidden', mode === 'login');
            document.getElementById('btn-login-tab').classList.toggle('active', mode === 'login');
            document.getElementById('btn-signup-tab').classList.toggle('active', mode === 'signup');
        }

        function toggleKB() { document.getElementById('keyboard-container').classList.toggle('hidden'); }

        function processAuth() {
            const name = document.getElementById('auth-name').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            if (!name || !pass) return;

            if (mode === 'signup') {
                localStorage.setItem(name, JSON.stringify({ pass }));
                alert("Muvaffaqiyatli ro'yxatdan o'tdingiz!");
                toggleMode('login');
            } else {
                const user = JSON.parse(localStorage.getItem(name));
                if (user && user.pass === pass) {
                    document.getElementById('current-user').innerText = name.toUpperCase();
                    document.getElementById('auth-overlay').style.display = 'none';
                    init();
                } else alert("Ism yoki parol xato!");
            }
        }

        function init() {
            if (timerInterval) clearInterval(timerInterval);
            isPlaying = false; timeLeft = maxTime;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('hidden-input').value = "";
            const words = wordBank[currentLang];
            let text = Array.from({length: 40}, () => words[Math.floor(Math.random() * words.length)]).join(' ');
            document.getElementById('text-display').innerHTML = text.split('').map((c, i) => `<span class="char ${i===0?'current':''}">${c}</span>`).join('');
            focusGame();
        }

        document.getElementById('hidden-input').addEventListener('input', function(e) {
            if (!isPlaying) {
                isPlaying = true;
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) { timeLeft--; document.getElementById('timer').innerText = timeLeft; }
                    else { clearInterval(timerInterval); isPlaying = false; init(); }
                }, 1000);
            }

            // Klaviatura effektini tuzatish (Xato tuzatildi)
            const lastChar = this.value.slice(-1).toLowerCase();
            const keyId = lastChar === ' ' ? 'key-space' : 'key-' + lastChar;
            const keyElement = document.getElementById(keyId);
            if (keyElement) {
                keyElement.classList.add('active');
                setTimeout(() => keyElement.classList.remove('active'), 150);
            }

            const spans = document.querySelectorAll('.char');
            const typed = this.value.split('');
            let correct = 0;
            spans.forEach((s, i) => {
                s.classList.remove('correct', 'incorrect', 'current');
                if (typed[i] == null) { if (i === typed.length) s.classList.add('current'); }
                else {
                    if (typed[i] === s.innerText) { s.classList.add('correct'); correct++; }
                    else s.classList.add('incorrect');
                }
            });
            document.getElementById('wpm').innerText = Math.round((correct/5) / ((maxTime-timeLeft || 1)/60)) || 0;
            document.getElementById('accuracy').innerText = typed.length > 0 ? Math.round((correct/typed.length)*100) : 100;
        });

        function toggleMusic() {
            const btn = document.getElementById('music-btn');
            if (audio.paused) { audio.play(); btn.innerText = "⏸️ TO'XTATISH"; }
            else { audio.pause(); btn.innerText = "🎵 CHALISH"; }
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            audio.src = playlist[currentTrackIndex];
            audio.play();
            document.getElementById('music-btn').innerText = "⏸️ TO'XTATISH";
        }

        function changeLang(l, btn) {
            currentLang = l;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            init();
        }

        function setTime(t, btn) {
            maxTime = t;
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            init();
        }

        function focusGame() {
            if (document.getElementById('auth-overlay').style.display === 'none') {
                document.getElementById('hidden-input').focus();
            }
        }
    </script>
</body>
</html>
