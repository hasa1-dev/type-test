<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasanboy & Sanjarbek - Typing System</title>
    <style>
        :root { 
            --neon: #00ff41; 
            --bg: #0a0a0f; 
            --glass: rgba(0, 20, 0, 0.85);
            --bg-img: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070&auto=format&fit=crop'); 
        }
        
        * { box-sizing: border-box; outline: none; }
        
        body { 
            margin: 0; 
            background: var(--bg-img) no-repeat center center fixed;
            background-size: cover;
            color: var(--neon); 
            font-family: 'Consolas', monospace; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }

        /* Overlay qatlami - orqa fonni biroz qorong'ulatish uchun */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.85);
            z-index: -1;
        }
        
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .container { 
            width: 100%; 
            max-width: 1000px; 
            padding: 30px; 
            background: var(--glass); 
            border: 1px solid rgba(0, 255, 65, 0.3); 
            border-radius: 20px; 
            text-align: center; 
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        /* LOGIN MODAL */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--neon);
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 30px var(--neon);
        }
        .login-card input {
            width: 100%;
            background: transparent;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 12px;
            margin: 20px 0;
            border-radius: 5px;
            font-family: inherit;
            text-align: center;
        }
        
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .btn { 
            background: transparent; 
            border: 1px solid var(--neon); 
            color: var(--neon); 
            padding: 8px 15px; 
            cursor: pointer; 
            border-radius: 6px; 
            transition: 0.3s; 
            font-family: inherit; 
        }
        .btn.active { background: var(--neon); color: #000; font-weight: bold; }
        .btn:hover:not(.active) { background: rgba(0, 255, 65, 0.1); }
        
        .stats-bar { 
            display: flex; 
            justify-content: space-around; 
            padding: 15px; 
            background: rgba(0,255,65,0.1); 
            margin-bottom: 20px; 
            border-radius: 12px; 
            font-size: 1.2rem; 
        }

        #text-display { 
            font-size: 1.8rem; 
            line-height: 1.6; 
            text-align: left; 
            height: 180px; 
            overflow-y: hidden; 
            margin: 15px 0; 
            color: rgba(0, 255, 65, 0.2); 
            padding: 15px; 
            user-select: none;
        }
        
        .char { position: relative; transition: 0.1s; border-bottom: 2px solid transparent; }
        .correct { color: var(--neon); text-shadow: 0 0 8px var(--neon); }
        .incorrect { color: #ff3e3e; background: rgba(255,62,62,0.2); border-radius: 2px; }
        .current { border-bottom: 3px solid var(--neon); animation: blink 1s infinite; }
        
        @keyframes blink { 50% { border-color: transparent; } }

        #hidden-input { position: absolute; opacity: 0; pointer-events: none; }

        #result-modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
            background: #000;
            border: 3px solid var(--neon);
            padding: 40px;
            z-index: 100;
            box-shadow: 0 0 100px rgba(0, 255, 65, 0.5);
            border-radius: 20px;
        }
        .motivation-text { font-size: 1.1rem; margin: 20px 0; color: #fff; line-height: 1.4; font-style: italic; }
        .final-stats { font-size: 3.5rem; color: var(--neon); font-weight: bold; }

        .about-section { 
            margin-top: 25px; 
            padding-top: 20px; 
            border-top: 1px dashed rgba(0,255,65,0.3); 
            font-size: 0.9rem; 
            opacity: 0.8; 
        }

        footer { padding: 15px; border-top: 1px solid rgba(0, 255, 65, 0.3); text-align: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        footer a { color: var(--neon); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body onclick="document.getElementById('hidden-input').focus()">

    <!-- LOGIN SECTION -->
    <div id="login-overlay">
        <div class="login-card">
            <h2 style="margin:0">IDENTITY CHECK</h2>
            <p style="font-size: 0.8rem; opacity: 0.7;">Enter username to access system</p>
            <input type="text" id="username" placeholder="USERNAME..." maxlength="15">
            <button class="btn active" style="width: 100%" onclick="login()">INITIALIZE</button>
        </div>
    </div>

    <main>
        <div class="container">
            <div id="result-modal">
                <h2 id="modal-title" style="margin:0; letter-spacing: 5px;">NATIJA</h2>
                <div class="final-stats"><span id="res-wpm">0</span></div>
                <div style="font-size: 1.2rem; margin-top: -10px;">WPM</div>
                <div id="motivation-msg" class="motivation-text"></div>
                <button id="retry-btn" class="btn active" onclick="init()" style="font-size: 1.1rem; padding: 12px 40px; width: 100%;">QAYTA URINISH</button>
            </div>

            <div class="controls">
                <button class="btn active lang-btn" onclick="changeLang('uz', this)">O'ZBEK</button>
                <button class="btn lang-btn" onclick="changeLang('en', this)">ENGLISH</button>
                <button class="btn lang-btn" onclick="changeLang('ru', this)">РУССКИЙ</button>
                <span style="color: #333; margin: 0 10px;">|</span>
                <button class="btn time-btn" onclick="setTime(15, this)">15s</button>
                <button class="btn time-btn active" onclick="setTime(30, this)">30s</button>
                <button class="btn time-btn" onclick="setTime(60, this)">60s</button>
                <button class="btn time-btn" onclick="setTime(90, this)">90s</button>
            </div>

            <div class="stats-bar">
                <span>USER: <b id="user-display">Guest</b></span>
                <span>TIME: <b id="timer">30</b>s</span>
                <span>WPM: <b id="wpm">0</b></span>
            </div>

            <div id="text-display"></div>
            <input type="text" id="hidden-input" autocomplete="off">

            <div class="about-section">
                <p>Ushbu tizim matn terish tezligini oshirish uchun <b>Hasanboy</b> va <b>Sanjarbek</b> tomonidan ishlab chiqildi.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>Architects: <a href="https://t.me/xsT00my" target="_blank">Hasanboy</a> & <a href="https://t.me/saSOObr" target="_blank">Sanjarbek</a></p>
        <p style="font-size: 0.8rem; opacity: 0.6;">Released: August 2025 | Version 2.0 (March 2026)</p>
    </footer>

    <script>
        const wordBank = {
            uz: ["xavfsizlik", "kirish", "ma'lumot", "kelajak", "algoritm", "zamonaviy", "klaviatura", "bajarish", "server", "obyekt", "parol", "tahlil", "blok", "ilova", "bilim", "ishonch", "mantiq", "funksiya", "tizim"],
            en: ["security", "login", "data", "future", "algorithm", "modern", "keyboard", "execute", "server", "object", "password", "analysis", "block", "application", "knowledge", "trust", "logic", "function", "system"],
            ru: ["защита", "вход", "данные", "будущее", "алгоритм", "современный", "клавиатура", "выполнить", "сервер", "объект", "пароль", "анализ", "блок", "приложение", "знания", "доверие", "логика", "функция", "система"]
        };

        const feedback = {
            uz: { title: "NATIJA", retry: "QAYTA URINISH", msg: ["Yaxshi!", "Ajoyib!", "Dahshat!", "HAKKER!"] },
            en: { title: "RESULT", retry: "RETRY", msg: ["Good!", "Great!", "Amazing!", "HACKER!"] },
            ru: { title: "РЕЗУЛЬТАТ", retry: "ПОВТОРИТЬ", msg: ["Хорошо!", "Отлично!", "Невероятно!", "ХАКЕР!"] }
        };

        let currentLang = 'uz', maxTime = 30, timeLeft = 30, isPlaying = false, timer = null;
        const display = document.getElementById('text-display');
        const input = document.getElementById('hidden-input');
        const modal = document.getElementById('result-modal');

        function login() {
            let name = document.getElementById('username').value;
            if(name.length < 2) name = "User_" + Math.floor(Math.random()*999);
            document.getElementById('user-display').innerText = name;
            document.getElementById('login-overlay').style.display = 'none';
            init();
        }

        function init() {
            if (timer) clearInterval(timer);
            timer = null; isPlaying = false; timeLeft = maxTime;
            input.value = "";
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('wpm').innerText = "0";
            modal.style.display = 'none';
            display.style.filter = "none";
            display.style.opacity = "1";

            const words = wordBank[currentLang];
            let text = Array.from({length: 100}, () => words[Math.floor(Math.random() * words.length)]).join(' ');
            display.innerHTML = text.split('').map((c, i) => `<span class="char ${i===0?'current':''}">${c}</span>`).join('');
            display.scrollTop = 0;
            input.focus();
        }

        function showResult(wpm) {
            const langData = feedback[currentLang];
            let msgIndex = 0;
            
            // Rejimga qarab baholash mantiqi
            let limits = maxTime == 15 ? [30, 55, 75] : maxTime >= 60 ? [18, 35, 55] : [25, 45, 65];
            
            if (wpm < limits[0]) msgIndex = 0;
            else if (wpm < limits[1]) msgIndex = 1;
            else if (wpm < limits[2]) msgIndex = 2;
            else msgIndex = 3;

            document.getElementById('modal-title').innerText = langData.title;
            document.getElementById('retry-btn').innerText = langData.retry;
            document.getElementById('res-wpm').innerText = wpm;
            document.getElementById('motivation-msg').innerText = langData.msg[msgIndex];
            
            display.style.filter = "blur(8px)";
            modal.style.display = 'block';
        }

        function setTime(s, btn) {
            if (isPlaying) return;
            maxTime = s;
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            init();
        }

        function changeLang(l, btn) {
            if (isPlaying) return;
            currentLang = l;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            init();
        }

        input.addEventListener('input', () => {
            if (!isPlaying && input.value.length > 0) {
                isPlaying = true;
                timer = setInterval(() => {
                    if (timeLeft > 0) { 
                        timeLeft--; 
                        document.getElementById('timer').innerText = timeLeft; 
                    } else { 
                        clearInterval(timer);
                        isPlaying = false;
                        showResult(document.getElementById('wpm').innerText);
                    }
                }, 1000);
            }

            const spans = display.querySelectorAll('.char');
            const typed = input.value.split('');
            let err = 0;
            
            spans.forEach((s, i) => {
                s.classList.remove('correct', 'incorrect', 'current');
                if (typed[i] == null) { 
                    if (i === typed.length) s.classList.add('current'); 
                } else {
                    if (typed[i] === s.innerText) s.classList.add('correct');
                    else { s.classList.add('incorrect'); err++; }
                }
            });

            let timeUsed = (maxTime - timeLeft) || 1;
            let wpm = Math.round(((typed.length - err) / 5) / (timeUsed / 60));
            document.getElementById('wpm').innerText = wpm > 0 ? wpm : 0;
        });
    </script>
</body>
</html>
