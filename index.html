<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasanboy - Typing System</title>
    <style>
        :root {
            --neon: #00ff41;
            --bg: #0a0a0f;
            --glass: rgba(0, 20, 0, 0.85);
        }

        * { box-sizing: border-box; outline: none; }

        body, html {
            margin: 0; padding: 0;
            min-height: 100vh; /* Telefon ekranini to'liq bo'yiga egallaydi */
            background: radial-gradient(circle at center, #001a00 0%, var(--bg) 100%);
            color: var(--neon);
            font-family: 'Consolas', monospace;
            display: flex;
            flex-direction: column; /* Elementlarni vertikal joylaydi */
        }

        /* ASOSIY QISM */
        main {
            flex: 1; /* Bu qism bo'sh joyni to'ldiradi va footerni pastga itaradi */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            padding: 30px 20px;
            background: var(--glass);
            border: 2px solid var(--neon);
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.15);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 8px 15px;
            cursor: pointer;
            font-family: inherit;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn.active { background: var(--neon); color: #000; font-weight: bold; }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 1.1rem;
        }

        /* MATN BLOKI - MOBILDA HAM KATTA BO'LADI */
        #text-display {
            font-size: 1.6rem; /* Telefon uchun qulay shrift */
            line-height: 1.4;
            min-height: 220px; /* Telefon ekranida kichik bo'lib qolmasligi uchun */
            text-align: left;
            margin: 15px 0;
            color: #004d1a;
            padding: 15px;
            border: 1px solid rgba(0, 255, 65, 0.2);
            word-break: break-word;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
        }

        /* NOUTBUK UCHUN SHRIFTNI KATTALASHTIRISH */
        @media (min-width: 1024px) {
            .container { padding: 40px; }
            #text-display { font-size: 2.4rem; min-height: 280px; }
            .stats-bar { font-size: 1.6rem; }
            .btn { font-size: 1.1rem; padding: 10px 20px; }
        }

        /* AVTOR QISMI - DOIM ENG PASTDA */
        footer {
            width: 100%;
            padding: 20px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid var(--neon);
            text-align: center;
        }

        footer p { margin: 5px 0; font-size: 0.9rem; }

        .char { transition: 0.1s; border-bottom: 2px solid transparent; }
        .correct { color: var(--neon); text-shadow: 0 0 8px var(--neon); }
        .incorrect { color: #ff3e3e; background: rgba(255, 62, 62, 0.2); border-radius: 2px; }
        .current { border-bottom: 3px solid var(--neon); background: rgba(0, 255, 65, 0.1); }

        #hidden-input { position: fixed; top: -100px; left: 0; opacity: 0; }

        .result-screen {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #000; border: 3px solid var(--neon); padding: 30px;
            z-index: 100; text-align: center; display: none; width: 90%; max-width: 500px;
        }
    </style>
</head>
<body onclick="document.getElementById('hidden-input').focus()">

    <main>
        <div class="container" id="main-ui">
            <div class="controls">
                <button class="btn active" onclick="changeLang('uz', this)">O'ZBEK</button>
                <button class="btn" onclick="changeLang('en', this)">ENGLISH</button>
                <button class="btn" onclick="changeLang('ru', this)">РУССКИЙ</button>
            </div>

            <div class="stats-bar">
                <span>TIME: <b id="timer">30</b>s</span>
                <span>WPM: <b id="wpm">0</b></span>
                <span>ERRORS: <b id="errors">0</b></span>
            </div>

            <div id="text-display"></div>
            <input type="text" id="hidden-input" autocomplete="off" autofocus>
        </div>
    </main>

    <footer>
        <p>Architect: <a href="https://t.me/xsT00my" target="_blank" style="color:var(--neon); text-decoration: none; border-bottom: 1px dashed var(--neon);">Hasanboy</a></p>
        <p style="opacity: 0.6; font-size: 0.8rem;">Dev: <b>hasan_dev</b> | 2025</p>
    </footer>

    <div id="result-screen" class="result-screen">
        <h1 style="color: var(--neon); margin-top:0;">YAKUNLANDI</h1>
        <p id="final-stats" style="color: #fff; font-size: 1.4rem; margin: 10px 0;"></p>
        <b id="motivation-text"></b>
        <br>
        <button onclick="location.reload()" style="padding: 12px 25px; cursor:pointer; background:var(--neon); border:none; font-weight:bold; margin-top:20px; border-radius:5px;">QAYTADAN</button>
    </div>

    <script>
        // JS kodi o'sha-o'sha, faqat init() dagi so'zlar sonini mobil uchun biroz moslashtirsangiz bo'ladi.
        const wordBank = {
            uz: ["texnologiya", "dasturlash", "internet", "tarmoq", "xavfsizlik", "tizim", "mantiq", "funksiya", "loyiha", "natija", "aloqa", "tezlik", "bilim", "tajriba", "terminal", "algoritm", "server", "shifr", "parol", "kirish", "yuklash", "zamonaviy", "protsessor", "klaviatura", "bajarish", "tahlil", "ishonch", "kelajak", "amaliyot", "ma'lumot", "obyekt", "klas", "kod", "blok", "sayt", "ilova"],
            en: ["technology", "programming", "internet", "network", "security", "system", "logic", "function", "project", "result", "connection", "speed", "knowledge", "experience", "terminal", "algorithm", "server", "cipher", "password", "login", "upload", "modern", "processor", "keyboard", "execute", "analysis", "trust", "future", "practice", "information", "object", "class", "code", "block", "site", "application"],
            ru: ["технология", "программирование", "интернет", "сеть", "безопасность", "система", "логика", "функция", "проект", "результат", "связь", "скорость", "знание", "опыт", "терминал", "алгоритm", "сервер", "шифр", "пароль", "вход", "загрузка", "современный", "процессор", "клавиатура", "выполнить", "анализ", "доверие", "будущее", "практика", "информация", "объект", "класс", "код", "блок", "сайт", "приложение"]
        };

        const motivBank = {
            uz: { high: "Haqiqiy professional! 🚀", med: "Yaxshi natija! 🔥", low: "Mashq qiling! 💪" },
            en: { high: "True professional! 🚀", med: "Great result! 🔥", low: "Keep practicing! 💪" },
            ru: { high: "Профессионал! 🚀", med: "Хороший результат! 🔥", low: "Тренируйтесь! 💪" }
        };

        const display = document.getElementById('text-display');
        const input = document.getElementById('hidden-input');
        
        let currentLang = 'uz';
        let timeLeft = 30;
        let isPlaying = false;
        let timer = null;

        function init() {
            const words = wordBank[currentLang];
            let text = Array.from({length: 40}, () => words[Math.floor(Math.random() * words.length)]).join(' ');
            display.innerHTML = text.split('').map((char, i) => `<span class="char ${i===0?'current':''}">${char}</span>`).join('');
            input.value = "";
            timeLeft = 30;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('wpm').innerText = "0";
            document.getElementById('errors').innerText = "0";
        }

        function changeLang(lang, btn) {
            if (isPlaying) return;
            currentLang = lang;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            init();
        }

        input.addEventListener('input', () => {
            if(!isPlaying && input.value.length > 0) {
                isPlaying = true;
                timer = setInterval(() => {
                    if(timeLeft > 0) { 
                        timeLeft--; 
                        document.getElementById('timer').innerText = timeLeft; 
                    } else { 
                        endGame();
                    }
                }, 1000);
            }

            const spans = display.querySelectorAll('.char');
            const typedChars = input.value.split('');
            let errors = 0;

            spans.forEach((span, index) => {
                const char = typedChars[index];
                span.classList.remove('correct', 'incorrect', 'current');
                
                if (char == null) {
                    if (index === typedChars.length) {
                        span.classList.add('current');
                        span.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else if (char === span.innerText) {
                    span.classList.add('correct');
                } else {
                    span.classList.add('incorrect');
                    errors++;
                }
            });

            document.getElementById('errors').innerText = errors;
            let elapsed = (30 - timeLeft) / 60;
            let wpm = Math.round(((typedChars.length - errors) / 5) / (elapsed || 0.01));
            document.getElementById('wpm').innerText = wpm > 0 ? wpm : 0;

            if (typedChars.length >= spans.length) endGame();
        });

        function endGame() {
            clearInterval(timer);
            const wpm = document.getElementById('wpm').innerText;
            const errors = document.getElementById('errors').innerText;
            document.getElementById('main-ui').style.opacity = '0.1';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-stats').innerText = `${wpm} WPM | ${errors} Xatolar`;
            const motivText = document.getElementById('motivation-text');
            const m = motivBank[currentLang];
            const wpmNum = parseInt(wpm);
            if (wpmNum >= 50) motivText.innerText = m.high;
            else if (wpmNum >= 25) motivText.innerText = m.med;
            else motivText.innerText = m.low;
        }

        init();
    </script>
</body>
</html>
