<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasanboy - Typing System</title>
    <style>
        :root {
            --neon: #00ff41;
            --bg: #0a0a0f;
            --glass: rgba(0, 20, 0, 0.85);
        }

        * { box-sizing: border-box; outline: none; }

        body, html {
            margin: 0; padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at center, #001a00 0%, var(--bg) 100%);
            color: var(--neon);
            font-family: 'Consolas', monospace;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            padding: 30px 20px;
            background: var(--glass);
            border: 2px solid var(--neon);
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.15);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 8px 15px;
            cursor: pointer;
            font-family: inherit;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn.active { background: var(--neon); color: #000; font-weight: bold; }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 1.1rem;
        }

        #text-display {
            font-size: 1.6rem;
            line-height: 1.4;
            min-height: 200px;
            max-height: 300px;
            overflow: hidden;
            text-align: left;
            margin: 15px 0;
            color: #004d1a;
            padding: 15px;
            border: 1px solid rgba(0, 255, 65, 0.2);
            word-break: break-word;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
        }

        .char { transition: 0.1s; border-bottom: 2px solid transparent; }
        .correct { color: var(--neon); text-shadow: 0 0 8px var(--neon); }
        .incorrect { color: #ff3e3e; background: rgba(255, 62, 62, 0.2); border-radius: 2px; }
        .current { border-bottom: 3px solid var(--neon); background: rgba(0, 255, 65, 0.1); }

        #hidden-input { position: fixed; top: -100px; left: 0; opacity: 0; }

        .result-screen {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #000; border: 3px solid var(--neon); padding: 30px;
            z-index: 100; text-align: center; display: none; width: 90%; max-width: 500px;
        }

        @media (min-width: 1024px) {
            #text-display { font-size: 2.2rem; min-height: 250px; }
        }
    </style>
</head>
<body onclick="document.getElementById('hidden-input').focus()">

    <main>
        <div class="container" id="main-ui">
            <div class="controls">
                <!-- TILLAR -->
                <button class="btn active lang-btn" onclick="changeLang('uz', this)">UZB</button>
                <button class="btn lang-btn" onclick="changeLang('en', this)">ENG</button>
                <button class="btn lang-btn" onclick="changeLang('ru', this)">RUS</button>
                
                <span style="color:rgba(0, 255, 65, 0.3)">|</span>
                
                <!-- SEKUND REJIMLARI SHU YERDA -->
                <button class="btn time-btn" onclick="setTime(15, this)">15s</button>
                <button class="btn time-btn active" onclick="setTime(30, this)">30s</button>
                <button class="btn time-btn" onclick="setTime(60, this)">60s</button>
                <button class="btn time-btn" onclick="setTime(90, this)">90s</button>
            </div>

            <div class="stats-bar">
                <span>TIME: <b id="timer">30</b>s</span>
                <span>WPM: <b id="wpm">0</b></span>
                <span>ERRORS: <b id="errors">0</b></span>
            </div>

            <div id="text-display"></div>
            <input type="text" id="hidden-input" autocomplete="off" autofocus>
        </div>
    </main>

    <div id="result-screen" class="result-screen">
        <h1 style="color: var(--neon);">YAKUNLANDI</h1>
        <p id="final-stats" style="color: #fff; font-size: 1.4rem;"></p>
        <button onclick="location.reload()" style="padding: 10px 20px; cursor:pointer; background:var(--neon); border:none; font-weight:bold;">QAYTADAN</button>
    </div>

    <script>
        const wordBank = {
            uz: ["texnologiya", "dasturlash", "internet", "tarmoq", "xavfsizlik", "tizim", "mantiq", "funksiya", "loyiha", "natija", "aloqa", "tezlik", "bilim", "tajriba", "terminal", "algoritm", "server", "shifr", "parol", "kirish", "yuklash", "zamonaviy", "protsessor", "klaviatura", "bajarish", "tahlil", "ishonch", "kelajak", "amaliyot", "ma'lumot", "obyekt", "klas", "kod", "blok", "sayt", "ilova"],
            en: ["technology", "programming", "internet", "network", "security", "system", "logic", "function", "project", "result", "connection", "speed", "knowledge", "experience", "terminal", "algorithm", "server", "cipher", "password", "login", "upload", "modern", "processor", "keyboard", "execute", "analysis", "trust", "future", "practice", "information", "object", "class", "code", "block", "site", "application"],
            ru: ["технология", "программирование", "интернет", "сеть", "безопасность", "система", "логика", "функция", "проект", "результат", "связь", "скорость", "знание", "опыт", "терминал", "алгоритм", "сервер", "шифр", "пароль", "вход", "загрузка", "современный", "процессор", "клавиатура", "выполнить", "анализ", "доверие", "будущее", "практика", "информация", "объект", "класс", "код", "блок", "сайт", "приложение"]
        };

        const display = document.getElementById('text-display');
        const input = document.getElementById('hidden-input');
        
        let currentLang = 'uz';
        let maxTime = 30; 
        let timeLeft = 30;
        let isPlaying = false;
        let timer = null;

        function init() {
            if (timer) clearInterval(timer);
            const words = wordBank[currentLang];
            let wordCount = maxTime > 30 ? 120 : 60; 
            let text = Array.from({length: wordCount}, () => words[Math.floor(Math.random() * words.length)]).join(' ');
            
            display.innerHTML = text.split('').map((char, i) => `<span class="char ${i===0?'current':''}">${char}</span>`).join('');
            input.value = "";
            timeLeft = maxTime; // Muhim: Tanlangan vaqtni o'rnatish
            isPlaying = false;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('wpm').innerText = "0";
            document.getElementById('errors').innerText = "0";
        }

        function setTime(seconds, btn) {
            if (isPlaying) return;
            maxTime = seconds;
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            init(); // Vaqt o'zgarganda o'yinni yangilash
        }

        function changeLang(lang, btn) {
            if (isPlaying) return;
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            init();
        }

        input.addEventListener('input', () => {
            if(!isPlaying && input.value.length > 0) {
                isPlaying = true;
                timer = setInterval(() => {
                    if(timeLeft > 0) { 
                        timeLeft--; 
                        document.getElementById('timer').innerText = timeLeft; 
                    } else { 
                        endGame();
                    }
                }, 1000);
            }

            const spans = display.querySelectorAll('.char');
            const typedChars = input.value.split('');
            let errors = 0;

            spans.forEach((span, index) => {
                const char = typedChars[index];
                span.classList.remove('correct', 'incorrect', 'current');
                
                if (char == null) {
                    if (index === typedChars.length) {
                        span.classList.add('current');
                        if(index > 15) span.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else if (char === span.innerText) {
                    span.classList.add('correct');
                } else {
                    span.classList.add('incorrect');
                    errors++;
                }
            });

            document.getElementById('errors').innerText = errors;
            let elapsed = (maxTime - timeLeft) / 60;
            let wpm = Math.round(((typedChars.length - errors) / 5) / (elapsed || 0.01));
            document.getElementById('wpm').innerText = wpm > 0 ? wpm : 0;
        });

        function endGame() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('main-ui').style.opacity = '0.1';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-stats').innerText = `${document.getElementById('wpm').innerText} WPM | ${document.getElementById('errors').innerText} Xatolar`;
        }

        init();
    </script>
</body>
</html>
