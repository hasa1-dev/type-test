<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tezkor Yozish Tizimi - Mobile Friendly</title>
    <style>
        :root {
            --neon: #00ff41;
            --bg: #0a0a0f;
            --glass: rgba(0, 20, 0, 0.85);
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; min-height: 100vh;
            background: radial-gradient(circle at center, #001a00 0%, var(--bg) 100%);
            color: var(--neon);
            font-family: 'Consolas', monospace;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 95%; max-width: 1000px;
            margin: 20px auto; padding: 20px;
            background: var(--glass);
            border: 3px solid var(--neon);
            border-radius: 10px;
            text-align: center;
        }

        .stats-bar {
            display: flex; justify-content: space-around;
            padding: 15px; background: rgba(0, 0, 0, 0.5);
            margin-bottom: 20px; border-radius: 5px;
        }

        /* MOBILDA SKROLL MUAMMOSINI YECHUVCHI QISM */
        #text-display {
            font-size: 2rem;
            line-height: 1.6;
            height: 180px; /* Balandlikni cheklaymiz */
            overflow-y: hidden; /* JS orqali avtomatik skroll bo'ladi */
            text-align: left;
            margin: 20px 0;
            color: #004d1a;
            position: relative;
            padding: 10px;
            border: 1px solid rgba(0, 255, 65, 0.1);
        }

        @media (max-width: 600px) {
            #text-display { font-size: 1.5rem; height: 140px; }
            .stats-bar { font-size: 0.9rem; flex-wrap: wrap; }
        }

        .char { transition: all 0.1s ease; }
        .correct { color: var(--neon); text-shadow: 0 0 10px var(--neon); }
        .incorrect { color: #ff0000; background: rgba(255, 0, 0, 0.2); }
        .current { 
            border-bottom: 4px solid var(--neon); 
            animation: blink 0.8s infinite;
            background: rgba(0, 255, 65, 0.1);
        }

        @keyframes blink { 50% { border-color: transparent; } }

        #hidden-input { 
            position: fixed; /* Fokusda turganda ekranni surib yubormasligi uchun */
            top: -100px; 
            left: 0; 
            opacity: 0; 
        }

        .author-card {
            width: 95%; max-width: 1000px;
            margin: 20px; padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--neon);
            text-align: center; border-radius: 10px;
        }

        .result-screen {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #000; border: 4px solid var(--neon); padding: 40px;
            z-index: 100; text-align: center; display: none; width: 90%;
        }
    </style>
</head>
<body onclick="document.getElementById('hidden-input').focus()">

    <div class="container" id="main-ui">
        <div class="stats-bar">
            <span>VAQT: <b id="timer">30</b>s</span>
            <span>WPM: <b id="wpm">0</b></span>
            <span>XATOLAR: <b id="errors">0</b></span>
        </div>

        <div id="text-display"></div>
        <input type="text" id="hidden-input" autocomplete="off" autofocus>
    </div>

    <div class="author-card">
        <p>Architect: <b>Hasanboy</b> | <a href="https://t.me/xsT00my" style="color:var(--neon)">@hasan_dev</a></p>
    </div>

    <div id="result-screen" class="result-screen">
        <h1 style="color: var(--neon)">NATIJA</h1>
        <p id="final-stats" style="color: #fff; font-size: 1.2rem;"></p>
        <button onclick="location.reload()" style="padding: 10px 20px; cursor:pointer; background:var(--neon); border:none; font-weight:bold;">QAYTADAN</button>
    </div>

    <script>
        const wordsList = ["texnologiya", "dasturlash", "internet", "tarmoq", "xavfsizlik", "tizim", "mantiq", "funksiya", "loyiha", "natija", "aloqa", "tezlik", "bilim", "tajriba", "terminal", "algoritm", "server", "shifr", "parol", "kirish", "yuklash", "zamonaviy", "protsessor", "klaviatura", "bajarish", "tahlil", "ishonch", "kelajak", "amaliyot", "ma'lumot", "obyekt", "klas", "kod", "blok", "sayt", "ilova"];

        const display = document.getElementById('text-display');
        const input = document.getElementById('hidden-input');
        
        let timeLeft = 30;
        let isPlaying = false;
        let timer = null;

        function init() {
            let text = Array.from({length: 60}, () => wordsList[Math.floor(Math.random() * wordsList.length)]).join(' ');
            display.innerHTML = text.split('').map((char, i) => `<span class="char ${i===0?'current':''}">${char}</span>`).join('');
        }

        input.addEventListener('input', () => {
            if(!isPlaying) {
                isPlaying = true;
                timer = setInterval(() => {
                    if(timeLeft > 0) { 
                        timeLeft--; 
                        document.getElementById('timer').innerText = timeLeft; 
                    } else { 
                        clearInterval(timer);
                        showResult();
                    }
                }, 1000);
            }

            const spans = display.querySelectorAll('.char');
            const typedChars = input.value.split('');
            let errors = 0;

            spans.forEach((span, index) => {
                const char = typedChars[index];
                span.classList.remove('correct', 'incorrect', 'current');
                
                if (char == null) {
                    if (index === typedChars.length) {
                        span.classList.add('current');
                        // MOBILDA SKROLLNI BOSHQARISH:
                        span.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else if (char === span.innerText) {
                    span.classList.add('correct');
                } else {
                    span.classList.add('incorrect');
                    errors++;
                }
            });

            document.getElementById('errors').innerText = errors;
            let wpm = Math.round(((typedChars.length - errors) / 5) / ((30 - timeLeft) / 60));
            document.getElementById('wpm').innerText = wpm > 0 ? wpm : 0;
        });

        function showResult() {
            document.getElementById('main-ui').style.opacity = '0.1';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-stats').innerText = `Tezlik: ${document.getElementById('wpm').innerText} WPM | Xatolar: ${document.getElementById('errors').innerText}`;
        }

        init();
    </script>
</body>
</html>
