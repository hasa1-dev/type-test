<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tezkor Yozish Tizimi </title>
    <style>
        :root {
            --neon: #00ff41; /* Klassik xaker yashili */
            --bg: #0a0a0f; /* To'q ko'k-qora fon */
            --glass: rgba(0, 20, 0, 0.85);
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; min-height: 100vh;
            background: radial-gradient(circle at center, #001a00 0%, var(--bg) 100%);
            color: var(--neon);
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Fon animatsiyasi */
        #bg-effect {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; opacity: 0.3;
            background-image: linear-gradient(rgba(0, 255, 65, 0.1) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 255, 65, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .container {
            width: 95%; max-width: 1000px;
            margin: 20px auto; padding: 20px;
            background: var(--glass);
            border: 3px solid var(--neon);
            box-shadow: 0 0 50px rgba(0, 255, 65, 0.2);
            border-radius: 10px;
            text-align: center;
        }

        .modes {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 10px; margin-bottom: 20px;
        }

        .mode-btn {
            background: transparent; border: 2px solid var(--neon);
            color: var(--neon); padding: 10px 20px; cursor: pointer;
            font-weight: bold; font-size: 1rem; transition: 0.3s;
        }

        .mode-btn.active, .mode-btn:hover {
            background: var(--neon); color: #000; box-shadow: 0 0 20px var(--neon);
        }

        .stats-bar {
            display: flex; justify-content: space-around;
            padding: 15px; background: rgba(0, 0, 0, 0.5);
            margin-bottom: 20px; border-radius: 5px; font-size: 1.2rem;
        }

        #text-display {
            font-size: 2rem; /* Kattaroq yozuv */
            line-height: 1.4; min-height: 200px;
            text-align: left; margin: 20px 0;
            color: #004d1a; user-select: none;
            word-break: break-word;
        }

        @media (max-width: 600px) {
            #text-display { font-size: 1.5rem; min-height: 150px; }
            .stats-bar { font-size: 1rem; flex-direction: column; gap: 5px; }
        }

        .char { position: relative; }
        .correct { color: var(--neon); text-shadow: 0 0 12px var(--neon); }
        .incorrect { color: #ff0000; background: rgba(255, 0, 0, 0.2); }
        .current { border-bottom: 4px solid var(--neon); animation: blink 0.8s infinite; }

        @keyframes blink { 50% { border-color: transparent; } }

        #hidden-input { position: absolute; opacity: 0; pointer-events: none; }

        /* MUALLIF BO'LIMI (Kattaroq va zamonaviy) */
        .author-card {
            width: 95%; max-width: 1000px;
            margin: 20px auto; padding: 30px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #fff; /* Oq chegara kontrast beradi */
            text-align: center; border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .author-card h3 { 
            margin: 0 0 10px 0; font-size: 1.8rem; color: #fff; 
            text-transform: uppercase; letter-spacing: 3px;
        }

        .author-card p { font-size: 1.2rem; color: #ccc; margin: 5px 0; }
        
        .author-card a {
            color: var(--neon); font-size: 1.4rem; font-weight: bold;
            text-decoration: none; border: 1px solid var(--neon);
            padding: 5px 15px; border-radius: 5px; display: inline-block;
            margin-top: 10px; transition: 0.3s;
        }

        .author-card a:hover { background: var(--neon); color: #000; }

        .result-screen {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #000; border: 4px solid var(--neon); padding: 50px;
            z-index: 100; text-align: center; display: none; width: 90%; max-width: 500px;
        }

        .retry-btn {
            background: var(--neon); color: #000; border: none;
            padding: 15px 30px; font-size: 1.2rem; cursor: pointer;
            font-weight: bold; margin-top: 20px;
        }
    </style>
</head>
<body onclick="document.getElementById('hidden-input').focus()">

    <div id="bg-effect"></div>

    <div class="container" id="main-ui">
        <div class="modes">
            <button class="mode-btn active" onclick="setMode(30, this)">30 SEK</button>
            <button class="mode-btn" onclick="setMode(60, this)">60 SEK</button>
            <button class="mode-btn" onclick="setMode(90, this)">90 SEK</button>
        </div>

        <div class="stats-bar">
            <span>VAQT: <b id="timer">30</b>s</span>
            <span>TEZLIK: <b id="wpm">0</b> WPM</span>
            <span>XATOLAR: <b id="errors">0</b></span>
        </div>

        <div id="text-display"></div>
        <input type="text" id="hidden-input" autocomplete="off">
    </div>

    <!-- MUALLIF VA MUROJAAT BO'LIMI -->
    <div class="author-card">
        <h3>Loyiha Muallifi</h3>
        <p>System Architect: <b>Hasanboy</b></p>
        <p>Loyiha yaratilgan sana: 2026-yil 4-may</p>
        <div style="margin-top: 15px;">
            <p>Murojaat uchun:</p>
            <a href="https://t.me/xsT00my" target="_blank">@hasan_dev</a>
        </div>
    </div>

    <div id="result-screen" class="result-screen">
        <h1 style="color: var(--neon)">MISSION ENDED</h1>
        <p id="final-stats" style="color: #fff; font-size: 1.5rem;"></p>
        <p id="motivation" style="color: yellow; font-size: 1.2rem;"></p>
        <button class="retry-btn" onclick="resetGame()">QAYTADAN URINIB KO'RISH</button>
    </div>

    <script>
        const uzbWords = ["texnologiya", "dasturlash", "internet", "tarmoq", "xavfsizlik", "tizim", "mantiq", "funksiya", "loyiha", "natija", "aloqa", "tezlik", "bilim", "tajriba", "terminal", "algoritm", "server", "shifr", "parol", "kirish", "yuklash", "zamonaviy", "protsessor", "klaviatura", "bajarish", "tahlil", "ishonch", "kelajak", "amaliyot", "ma'lumot", "obyekt", "klas", "kod", "blok", "sayt", "ilova"];

        const display = document.getElementById('text-display');
        const input = document.getElementById('hidden-input');
        const timerTag = document.getElementById('timer');
        const wpmTag = document.getElementById('wpm');
        const errorTag = document.getElementById('errors');
        
        let maxTime = 30;
        let timeLeft = maxTime;
        let timer = null;
        let isPlaying = false;

        function setMode(sec, btn) {
            maxTime = sec;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            resetGame();
        }

        function generateText() {
            let res = [];
            for(let i=0; i<60; i++) {
                res.push(uzbWords[Math.floor(Math.random() * uzbWords.length)]);
            }
            return res.join(" ");
        }

        function init() {
            const text = generateText();
            display.innerHTML = "";
            text.split('').forEach((char, index) => {
                const span = document.createElement('span');
                span.innerText = char; span.classList.add('char');
                if (index === 0) span.classList.add('current');
                display.appendChild(span);
            });
            input.value = "";
            timeLeft = maxTime;
            isPlaying = false;
            clearInterval(timer);
            timerTag.innerText = timeLeft;
            wpmTag.innerText = "0"; errorTag.innerText = "0";
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('main-ui').style.opacity = '1';
        }

        input.addEventListener('input', () => {
            if(!isPlaying && input.value.length > 0) {
                isPlaying = true;
                timer = setInterval(() => {
                    if(timeLeft > 0) { timeLeft--; timerTag.innerText = timeLeft; }
                    else { endGame(); }
                }, 1000);
            }

            const spans = display.querySelectorAll('span');
            const typedChars = input.value.split('');
            let errors = 0;

            spans.forEach((span, index) => {
                const char = typedChars[index];
                span.classList.remove('correct', 'incorrect', 'current');
                if (char == null) return;
                if (char === span.innerText) span.classList.add('correct');
                else { span.classList.add('incorrect'); errors++; }
            });

            if (typedChars.length < spans.length) spans[typedChars.length].classList.add('current');
            errorTag.innerText = errors;
            let wpm = Math.round(((typedChars.length - errors) / 5) / ((maxTime - timeLeft) / 60));
            wpmTag.innerText = wpm > 0 ? wpm : 0;
        });

        function endGame() {
            clearInterval(timer);
            const wpm = parseInt(wpmTag.innerText);
            document.getElementById('main-ui').style.opacity = '0.1';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-stats').innerText = `Tezlik: ${wpm} WPM | Xatolar: ${errorTag.innerText}`;
            
            const motiv = document.getElementById('motivation');
            if(wpm >= 40) motiv.innerText = "Dunyodagi 60% odamdan tezroqsiz!";
            else motiv.innerText = "Siz bundan ham ko'prog'iga qodirsiz!";
        }

        function resetGame() { init(); input.focus(); }
        init();
    </script>
</body>
</html>
