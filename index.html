<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasanboy & Sanjarbek - Typing System</title>
    <style>
        :root { --neon: #00ff41; --bg: #0a0a0f; --glass: rgba(0, 20, 0, 0.9); }
        * { box-sizing: border-box; outline: none; }
        body { margin: 0; background: var(--bg); color: var(--neon); font-family: 'Consolas', monospace; display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }
        
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 1000px; padding: 30px; background: var(--glass); border: 2px solid var(--neon); border-radius: 15px; text-align: center; position: relative; }
        
        .about-section { margin-top: 20px; padding: 15px; border-top: 1px dashed rgba(0,255,65,0.3); font-size: 0.85rem; opacity: 0.8; line-height: 1.5; }
        
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .btn { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 8px 15px; cursor: pointer; border-radius: 6px; transition: 0.3s; font-family: inherit; }
        .btn.active { background: var(--neon); color: #000; font-weight: bold; }
        
        .stats-bar { display: flex; justify-content: space-around; padding: 15px; background: rgba(0,255,65,0.05); margin-bottom: 20px; border-radius: 8px; font-size: 1.2rem; }
        #text-display { font-size: 1.8rem; line-height: 1.5; text-align: left; height: 180px; overflow: hidden; margin: 15px 0; color: #004d1a; padding: 10px; user-select: none; }
        
        .char { border-bottom: 2px solid transparent; }
        .correct { color: var(--neon); text-shadow: 0 0 5px var(--neon); }
        .incorrect { color: #ff3e3e; background: rgba(255,62,62,0.2); }
        .current { border-bottom: 3px solid var(--neon); }
        
        #hidden-input { position: absolute; opacity: 0; }

        /* --- NATIJA BLOKI (MODAL) STILI --- */
        #result-modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            background: #000;
            border: 3px solid var(--neon);
            padding: 40px;
            z-index: 100;
            box-shadow: 0 0 50px rgba(0, 255, 65, 0.2);
            border-radius: 20px;
        }
        .motivation-text { font-size: 1.5rem; margin: 20px 0; color: #fff; font-style: italic; }
        .final-stats { font-size: 2.5rem; color: var(--neon); margin-bottom: 20px; }

        footer { padding: 20px; border-top: 1px solid var(--neon); text-align: center; background: rgba(0,0,0,0.8); line-height: 1.6; }
        footer a { color: var(--neon); text-decoration: none; border-bottom: 1px solid transparent; transition: 0.3s; }
        footer a:hover { border-bottom: 1px solid var(--neon); }
    </style>
</head>
<body onclick="document.getElementById('hidden-input').focus()">

    <main>
        <div class="container" id="main-ui">
            <!-- Natija oynasi -->
            <div id="result-modal">
                <h1 style="margin-top:0">NATIJA</h1>
                <div class="final-stats"><span id="res-wpm">0</span> WPM</div>
                <div id="motivation-msg" class="motivation-text"></div>
                <button class="btn" onclick="closeModal()" style="font-size: 1.2rem; padding: 10px 30px;">QAYTA URINISH</button>
            </div>

            <div class="controls">
                <button class="btn active lang-btn" onclick="changeLang('uz', this)">O'ZBEK</button>
                <button class="btn lang-btn" onclick="changeLang('en', this)">ENGLISH</button>
                <button class="btn lang-btn" onclick="changeLang('ru', this)">РУССКИЙ</button>
                <span style="color: #555">|</span>
                <button class="btn time-btn" onclick="setTime(15, this)">15s</button>
                <button class="btn time-btn active" onclick="setTime(30, this)">30s</button>
                <button class="btn time-btn" onclick="setTime(60, this)">60s</button>
                <button class="btn time-btn" onclick="setTime(90, this)">90s</button>
            </div>

            <div class="stats-bar">
                <span>TIME: <b id="timer">30</b>s</span>
                <span>WPM: <b id="wpm">0</b></span>
                <span>ERRORS: <b id="errors">0</b></span>
            </div>

            <div id="text-display"></div>
            <input type="text" id="hidden-input" autofocus autocomplete="off">

            <div class="about-section">
                <p>Ushbu tizim matn terish tezligini oshirish uchun <b>Hasanboy</b> va <b>Sanjarbek</b> tomonidan ishlab chiqildi. <br> 
                Texnologiyalar: HTML5, CSS3 (Matrix Style), JavaScript ES6.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>Architects: 
            <a href="https://t.me/xsT00my" target="_blank">Hasanboy</a> & 
            <a href="https://t.me/saSOObr" target="_blank">Sanjarbek</a>
        </p>
        <p style="font-size: 0.8rem; opacity: 0.7;">
            <a href="https://github.com/Hasanboy-dev" target="_blank">GitHub</a> | 
            Released: August 2025 | Dev: hasan_dev
        </p>
    </footer>

    <script>
        const wordBank = {
            uz: ["xavfsizlik", "kirish", "ma'lumot", "natija", "kelajak", "algoritm", "zamonaviy", "klaviatura", "bajarish", "server", "obyekt", "parol", "tahlil", "blok", "ilova", "bilim", "ishonch", "mantiq", "funksiya", "tizim"],
            en: ["security", "login", "data", "result", "future", "algorithm", "modern", "keyboard", "execute", "server", "object", "password", "analysis", "block", "application", "knowledge", "trust", "logic", "function", "system"],
            ru: ["защита", "вход", "данные", "результат", "будущее", "алгоритм", "современный", "клавиатура", "выполнить", "сервер", "объект", "пароль", "анализ", "блок", "приложение", "знания", "доверие", "логика", "функция", "система"]
        };

        let currentLang = 'uz', maxTime = 30, timeLeft = 30, isPlaying = false, timer = null;
        const display = document.getElementById('text-display');
        const input = document.getElementById('hidden-input');
        const modal = document.getElementById('result-modal');

        function init() {
            if (timer) clearInterval(timer);
            const words = wordBank[currentLang];
            let text = Array.from({length: 150}, () => words[Math.floor(Math.random() * words.length)]).join(' ');
            display.innerHTML = text.split('').map((c, i) => `<span class="char ${i===0?'current':''}">${c}</span>`).join('');
            input.value = ""; timeLeft = maxTime; isPlaying = false;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('wpm').innerText = "0";
            document.getElementById('errors').innerText = "0";
            modal.style.display = 'none';
        }

        function showResult(wpm) {
            let msg = "";
            let color = "#00ff41";

            // Motivatsion mantiq
            if (wpm < 20) {
                msg = "Yaxshi urinish! Ko'proq mashq qiling, tezlik albatta oshadi. 💪";
            } else if (wpm < 40) {
                msg = "Ajoyib! Siz o'rtacha darajadasiz. Yana biroz harakat qilsangiz rekord berasiz! 🚀";
            } else if (wpm < 60) {
                msg = "Dahshat! Sizning barmoqlaringiz klaviatura bilan tillashyapti! ⚡";
            } else {
                msg = "HAKKER DARAJASI! 🤖 Siz haqiqiy matn terish ustasisiz! Legend!";
                color = "gold";
            }

            document.getElementById('res-wpm').innerText = wpm;
            document.getElementById('res-wpm').style.color = color;
            document.getElementById('motivation-msg').innerText = msg;
            modal.style.display = 'block';
        }

        function closeModal() {
            modal.style.display = 'none';
            init();
            input.focus();
        }

        function setTime(s, btn) {
            if (isPlaying) return;
            maxTime = s;
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            init();
        }

        function changeLang(l, btn) {
            if (isPlaying) return;
            currentLang = l;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            init();
        }

        input.addEventListener('input', () => {
            if (!isPlaying && input.value.length > 0) {
                isPlaying = true;
                timer = setInterval(() => {
                    if (timeLeft > 0) { 
                        timeLeft--; 
                        document.getElementById('timer').innerText = timeLeft; 
                    } else { 
                        clearInterval(timer);
                        showResult(document.getElementById('wpm').innerText);
                    }
                }, 1000);
            }
            const spans = display.querySelectorAll('.char');
            const typed = input.value.split('');
            let err = 0;
            
            spans.forEach((s, i) => {
                s.classList.remove('correct', 'incorrect', 'current');
                if (typed[i] == null) { if (i === typed.length) s.classList.add('current'); }
                else if (typed[i] === s.innerText) s.classList.add('correct');
                else { s.classList.add('incorrect'); err++; }
                
                if (i === typed.length && i > 15) {
                    s.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });

            document.getElementById('errors').innerText = err;
            let elapsed = (maxTime - timeLeft) / 60;
            let wpm = Math.round(((typed.length - err) / 5) / (elapsed || 0.01));
            document.getElementById('wpm').innerText = wpm > 0 ? wpm : 0;
        });

        init();
    </script>
</body>
</html>
