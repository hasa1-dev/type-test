<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasanboy & Sanjarbek - Typing System v2.0</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        :root { 
            --neon: #00ff41; 
            --bg: #0a0a0f; 
            --glass: rgba(0, 20, 0, 0.9);
            --bg-img: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070&auto=format&fit=crop'); 
        }
        
        * { box-sizing: border-box; outline: none; }
        
        body { 
            margin: 0; 
            background: var(--bg-img) no-repeat center center fixed;
            background-size: cover;
            color: var(--neon); 
            font-family: 'Courier New', monospace; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: -1;
        }
        
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .container { 
            width: 100%; 
            max-width: 900px; 
            padding: 25px; 
            background: var(--glass); 
            border: 1px solid var(--neon); 
            border-radius: 15px; 
            text-align: center; 
            backdrop-filter: blur(15px);
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.2);
        }

        /* Login Oynasi - Hacker Style */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; align-items: center; justify-content: center;
            z-index: 2000;
        }

        .login-card {
            background: rgba(0, 40, 0, 0.3);
            border: 2px solid var(--neon);
            padding: 35px;
            border-radius: 15px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 0 30px var(--neon);
        }

        .login-card input {
            width: 100%;
            background: #000;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 12px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: inherit;
        }
        
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        
        .btn { 
            background: transparent; 
            border: 1px solid var(--neon); 
            color: var(--neon); 
            padding: 8px 18px; 
            cursor: pointer; 
            transition: 0.2s; 
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .btn.active { background: var(--neon); color: #000; font-weight: bold; box-shadow: 0 0 15px var(--neon); }
        
        .stats-bar { 
            display: flex; 
            justify-content: space-around; 
            padding: 15px; 
            border: 1px solid rgba(0, 255, 65, 0.3);
            margin-bottom: 20px; 
            background: rgba(0,0,0,0.5);
            flex-wrap: wrap;
            gap: 10px;
        }

        #text-display { 
            font-size: 1.4rem; 
            line-height: 1.6; 
            text-align: left; 
            min-height: 120px;
            margin: 20px 0; 
            color: rgba(0, 255, 65, 0.2); 
            padding: 15px; 
            word-wrap: break-word;
            user-select: none;
        }
        
        .char { transition: 0.05s; position: relative; }
        .correct { color: var(--neon); text-shadow: 0 0 8px var(--neon); }
        .incorrect { color: #ff0000; background: rgba(255, 0, 0, 0.2); border-radius: 2px; }
        .current { border-bottom: 2px solid var(--neon); animation: blink 0.8s infinite; }
        
        @keyframes blink { 50% { border-color: transparent; } }

        #hidden-input { position: fixed; top: -100px; opacity: 0; }

        .about-section { 
            margin-top: 30px; 
            padding: 15px;
            border-top: 1px solid rgba(0,255,65,0.2); 
            font-size: 0.9rem; 
        }

        footer { padding: 20px; text-align: center; background: rgba(0,0,0,0.9); width: 100%; }
        footer a { color: var(--neon); text-decoration: none; border-bottom: 1px solid transparent; }
        footer a:hover { border-bottom: 1px solid var(--neon); }

        /* Mobil qurilmalar uchun moslashuvchanlik */
        @media (max-width: 600px) {
            #text-display { font-size: 1.1rem; }
            .container { padding: 15px; }
            .btn { padding: 6px 12px; font-size: 0.75rem; }
        }
    </style>
</head>
<body onclick="focusGame()">

    <div id="login-overlay">
        <div class="login-card">
            <h2 style="margin-bottom: 20px; letter-spacing: 2px;">ACCESS REQUIRED</h2>
            <input type="email" id="email" placeholder="TERMINAL_ID (EMAIL)..." onclick="event.stopPropagation()">
            <input type="password" id="password" placeholder="ACCESS_KEY (PASS)..." onclick="event.stopPropagation()">
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn active" style="flex: 1;" onclick="handleAuth('login')">LOGIN</button>
                <button class="btn" style="flex: 1;" onclick="handleAuth('signup')">SIGN UP</button>
            </div>
            <p id="auth-error" style="color: #ff0000; font-size: 0.75rem; margin-top: 15px; min-height: 20px;"></p>
        </div>
    </div>

    <main>
        <div class="container">
            <div class="controls">
                <button class="btn active lang-btn" onclick="changeLang('uz', this)">O'ZBEK</button>
                <button class="btn lang-btn" onclick="changeLang('en', this)">ENGLISH</button>
                <button class="btn time-btn" onclick="setTime(15, this)">15s</button>
                <button class="btn time-btn active" onclick="setTime(30, this)">30s</button>
                <button class="btn time-btn" onclick="setTime(60, this)">60s</button>
                <button class="btn time-btn" onclick="setTime(90, this)">90s</button>
            </div>

            <div class="stats-bar">
                <span>USER: <b id="user-display">GUEST</b></span>
                <span>TIMER: <b id="timer">30</b>s</span>
                <span>SPEED: <b id="wpm">0</b> WPM</span>
                <span>ACC: <b id="accuracy">100</b>%</span>
            </div>

            <div id="text-display"></div>
            <input type="text" id="hidden-input" autocomplete="off" spellcheck="false">

            <div class="about-section">
                <p>Architects: <b>Hasanboy</b> & <b>Sanjarbek</b> [System v2.0]</p>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 | <a href="https://t.me/xsT00my" target="_blank">@Hasanboy</a> | <a href="https://t.me/saSOObr" target="_blank">@Sanjarbek</a></p>
    </footer>

    <script>
        // Rasmda (image_e6a216.png) ko'rsatilgan haqiqiy Firebase sozlamalari
        const firebaseConfig = {
            apiKey: "AIzaSyAMlnVkcw1shnK_rFKSfrZqofViB5J3wGo",
            authDomain: "type-test-9.firebaseapp.com",
            projectId: "type-test-9",
            storageBucket: "type-test-9.firebasestorage.app",
            messagingSenderId: "321070843199",
            appId: "1:321070843199:web:cdfcdf67ce64da0beabf8a",
            measurementId: "G-K21PXXTNTZ"
        };
        firebase.initializeApp(firebaseConfig);

        const wordBank = {
            uz: ["tizim", "xavfsizlik", "algoritm", "klaviatura", "bajarish", "mantiq", "server", "ma'lumot", "dastur", "kodlash", "tarmoq", "foydalanuvchi", "xaker", "kriptografiya", "interfeys"],
            en: ["system", "security", "algorithm", "keyboard", "execute", "logic", "server", "database", "program", "coding", "network", "user", "hacker", "encryption", "interface"]
        };

        let currentLang = 'uz', maxTime = 30, timeLeft = 30, isPlaying = false, timerInterval = null;
        const display = document.getElementById('text-display');
        const input = document.getElementById('hidden-input');

        function focusGame() {
            if (document.getElementById('login-overlay').style.display === 'none') {
                input.focus();
            }
        }

        function handleAuth(type) {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const errorElement = document.getElementById('auth-error');

            if(!email || !pass) {
                errorElement.innerText = "MISSING_CREDENTIALS: Email and password required.";
                return;
            }

            if(type === 'login') {
                firebase.auth().signInWithEmailAndPassword(email, pass)
                    .then(res => { 
                        document.getElementById('user-display').innerText = res.user.email.split('@')[0].toUpperCase();
                        document.getElementById('login-overlay').style.display = 'none';
                        init();
                    })
                    .catch(err => errorElement.innerText = "AUTH_ERROR: " + err.message);
            } else {
                firebase.auth().createUserWithEmailAndPassword(email, pass)
                    .then(() => alert("REGISTRATION_SUCCESS: Please login now."))
                    .catch(err => errorElement.innerText = "REG_ERROR: " + err.message);
            }
        }

        function init() {
            if (timerInterval) clearInterval(timerInterval);
            isPlaying = false; 
            timeLeft = maxTime;
            input.value = "";
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('wpm').innerText = "0";
            document.getElementById('accuracy').innerText = "100";
            
            const words = wordBank[currentLang];
            let generatedText = Array.from({length: 60}, () => words[Math.floor(Math.random() * words.length)]).join(' ');
            display.innerHTML = generatedText.split('').map((c, i) => `<span class="char ${i===0?'current':''}">${c}</span>`).join('');
            focusGame();
        }

        input.addEventListener('input', () => {
            if (!isPlaying && input.value.length > 0) {
                isPlaying = true;
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) { 
                        timeLeft--; 
                        document.getElementById('timer').innerText = timeLeft; 
                    } else { 
                        clearInterval(timerInterval); 
                        isPlaying = false; 
                        const finalWpm = document.getElementById('wpm').innerText;
                        const finalAcc = document.getElementById('accuracy').innerText;
                        alert(`SESSION_END\nSpeed: ${finalWpm} WPM\nAccuracy: ${finalAcc}%`); 
                        init(); 
                    }
                }, 1000);
            }

            const spans = display.querySelectorAll('.char');
            const typedChars = input.value.split('');
            let correctCount = 0;
            let totalTyped = typedChars.length;

            spans.forEach((s, i) => {
                s.classList.remove('correct', 'incorrect', 'current');
                if (typedChars[i] == null) {
                    if (i === totalTyped) s.classList.add('current');
                } else {
                    if (typedChars[i] === s.innerText) { 
                        s.classList.add('correct'); 
                        correctCount++; 
                    } else {
                        s.classList.add('incorrect');
                    }
                }
            });

            // WPM va Accuracy hisoblash
            let timeUsed = (maxTime - timeLeft) || 1;
            let wpm = Math.round((correctCount / 5) / (timeUsed / 60));
            let accuracy = totalTyped > 0 ? Math.round((correctCount / totalTyped) * 100) : 100;
            
            document.getElementById('wpm').innerText = wpm;
            document.getElementById('accuracy').innerText = accuracy;

            // Agar matn tugasa, yangisini yuklash
            if (totalTyped >= spans.length) init();
        });

        function setTime(s, btn) { 
            maxTime = s; 
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active')); 
            btn.classList.add('active'); 
            init(); 
        }

        function changeLang(l, btn) { 
            currentLang = l; 
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active')); 
            btn.classList.add('active'); 
            init(); 
        }
    </script>
</body>
</html>
